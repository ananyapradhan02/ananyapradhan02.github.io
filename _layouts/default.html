<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% if page.title %}{{ page.title }} · {% endif %}{{ site.title }}</title>
<meta name="description" content="{{ page.excerpt | default: site.description | strip_html | strip_newlines | truncate: 160 }}">
<style>
  :root { --ink:#1b1b1b; --paper:#fbfaf8; --green:#0B5345; --gray:#6b6b6b; --rule:#e8e5df; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--paper); color:var(--ink); font-family:Georgia,'Times New Roman',serif; font-size:18px; line-height:1.65; }
  .wrap { max-width:640px; margin:0 auto; padding:48px 20px 80px; }
  header.site { display:flex; justify-content:space-between; align-items:baseline; margin-bottom:56px; }
  header.site a.name { font-weight:bold; color:var(--ink); text-decoration:none; font-size:19px; letter-spacing:.2px; }
  nav a { color:var(--gray); text-decoration:none; margin-left:18px; font-size:14px; font-family:Helvetica,Arial,sans-serif; letter-spacing:.6px; text-transform:uppercase; }
  nav a:hover, a:hover { color:var(--green); }
  h1 { font-size:30px; line-height:1.25; margin:0 0 10px; }
  h2 { font-size:21px; margin:36px 0 10px; }
  h3 { font-size:18px; margin:28px 0 8px; }
  a { color:var(--green); }
  .subtitle { color:var(--gray); font-style:italic; margin:0 0 34px; }
  ul.essays { list-style:none; padding:0; }
  ul.essays li { padding:16px 0; border-bottom:1px solid var(--rule); }
  ul.essays a { font-size:20px; text-decoration:none; color:var(--ink); }
  ul.essays a:hover { color:var(--green); }
  ul.essays .sub { color:var(--gray); font-size:15.5px; margin-top:3px; }
  blockquote { margin:0; padding-left:18px; border-left:3px solid var(--green); color:var(--gray); }
  hr { border:none; border-top:1px solid var(--rule); margin:36px 0; }
  .kicker { font-family:Helvetica,Arial,sans-serif; font-size:12.5px; letter-spacing:1.4px; text-transform:uppercase; color:var(--green); margin-bottom:8px; }
  footer.site { margin-top:70px; padding-top:20px; border-top:1px solid var(--rule); color:var(--gray); font-size:14px; }
  footer.site a { color:var(--gray); }
</style>
</head>
<body>
<div class="wrap">
  <header class="site">
    <a class="name" href="{{ '/' | relative_url }}">Ananya Pradhan</a>
    <nav>
      <a href="{{ '/' | relative_url }}">Essays</a>
      <a href="{{ '/research' | relative_url }}">Research</a>
      <a href="{{ '/about' | relative_url }}">About</a>
    </nav>
  </header>
  {{ content }}
  <footer class="site">
    <a href="https://github.com/ananyapradhan02">GitHub</a> · <a href="https://huggingface.co/ananyapradhan">Hugging Face</a> · <a href="https://www.linkedin.com/in/anyapradhan/">LinkedIn</a> · <a href="https://medium.com/@ananyapradhan02">Medium</a>
  </footer>
</div>
</body>
</html>
